
<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د موټرسایکل پرزو مدیریت</title>
<style>
body{font-family:Arial;background:#f1f4f8;margin:0;color:#172033}
header{background:#123b60;color:white;padding:18px;text-align:center}
main{padding:12px;max-width:650px;margin:auto}
.card{background:white;padding:14px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border:1px solid #bbb;border-radius:8px;font-size:16px}
button{background:#1769aa;color:white;border:0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.menu button{min-height:50px}
.product{border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:8px}
small{color:#555}
</style>
</head>
<body>
<header>
<h2>د موټرسایکل پرزو مدیریت</h2>
<p>Motorcycle Parts Management</p>
</header>
<main>
<div class="card">
<button onclick="changeLang()">پښتو / English</button>
<h3 id="branchTitle">څانګه وټاکئ</h3>
<select id="branch" onchange="show(currentPage)">
<option>میدان ښار</option>
<option>کندوز</option>
</select>
</div>
<div class="card">
<h3 id="dashboard">اصلي صفحه</h3>
<div class="menu">
<button onclick="show('products')">پرزې / Products</button>
<button onclick="show('customers')">پېرودونکي / Customers</button>
<button onclick="show('sales')">خرڅلاو / Sales</button>
<button onclick="show('expenses')">لګښتونه / Expenses</button>
<button onclick="show('reports')">راپورونه / Reports</button>
<button onclick="show('employees')">کارکوونکي / Employees</button>
</div>
</div>
<div class="card" id="content">
<h3>ښه راغلاست!</h3>
<p>د خپلې څانګې د کار پیل وکړئ.</p>
</div>
</main>
<script>
let english=false;
let currentPage='';
function key(){
return 'parts_'+document.getElementById('branch').value;
}
function readData(){
try{return JSON.parse(localStorage.getItem(key())||'[]')}
catch(e){return []}
}
function saveData(data){
localStorage.setItem(key(),JSON.stringify(data));
}
function changeLang(){
english=!english;
document.documentElement.dir=english?'ltr':'rtl';
document.getElementById('branchTitle').innerText=english?'Select Branch':'څانګه وټاکئ';
document.getElementById('dashboard').innerText=english?'Dashboard':'اصلي صفحه';
if(currentPage)show(currentPage);
}
function show(page){
currentPage=page;
let names={
products:['پرزې','Products'],
customers:['پېرودونکي','Customers'],
sales:['خرڅلاو','Sales'],
expenses:['لګښتونه','Expenses'],
reports:['راپورونه','Reports'],
employees:['کارکوونکي','Employees']
};
let title=names[page][english?1:0];
let c=document.getElementById('content');
if(page==='products'){
c.innerHTML=`
<h3>${title}</h3>
<p>${english?'Selected branch: ':'ټاکل شوې څانګه: '}${document.getElementById('branch').value}</p>
<label>${english?'Part name':'د پرزې نوم'}</label>
<input id="pname" placeholder="${english?'Part name':'د پرزې نوم'}">
<label>${english?'Purchase price in USD':'د رانیولو قیمت په ډالرو'}</label>
<input id="buyUSD" type="number" step="0.01" placeholder="0.00" oninput="calcBuy()">
<label>${english?'Dollar exchange rate (AFN)':'د ډالر د تبادلې نرخ په افغانیو'}</label>
<input id="rate" type="number" step="0.01" placeholder="مثلاً 70" oninput="calcBuy()">
<label>${english?'Purchase price in AFN':'د رانیولو قیمت په افغانیو'}</label>
<input id="buyAFN" type="number" readonly placeholder="اتومات حسابېږي">
<label>${english?'Selling price in USD':'د خرڅولو قیمت په ډالرو'}</label>
<input id="sellUSD" type="number" step="0.01" placeholder="0.00" oninput="calcSellUSD()">
<label>${english?'Selling price in AFN':'د خرڅولو قیمت په افغانیو'}</label>
<input id="sellAFN" type="number" step="0.01" placeholder="0.00" oninput="calcSellAFN()">
<label>${english?'Quantity':'تعداد'}</label>
<input id="qty" type="number" min="0" placeholder="0">
<button onclick="addProduct()">${english?'Add product':'پرزه اضافه کول'}</button>
<div id="items"></div>`;
renderProducts();
}else if(page==='customers'){
c.innerHTML=`<h3>${title}</h3>
<input id="itemName" placeholder="${english?'Customer name':'د پېرودونکي نوم'}">
<button onclick="addCustomer()">${english?'Add':'اضافه کول'}</button>
<div id="items"></div>`;
}else{
c.innerHTML='<h3>'+title+'</h3><p>'+(english?'This section will be developed next.':'دا برخه به په راتلونکو پړاوونو کې بشپړه شي.')+'</p>';
}
}
function calcBuy(){
let usd=Number(document.getElementById('buyUSD').value)||0;
let rate=Number(document.getElementById('rate').value)||0;
document.getElementById('buyAFN').value=(usd*rate).toFixed(2);
}
function calcSellUSD(){
let usd=Number(document.getElementById('sellUSD').value)||0;
let rate=Number(document.getElementById('rate').value)||0;
document.getElementById('sellAFN').value=rate?(usd*rate).toFixed(2):'';
}
function calcSellAFN(){
let afn=Number(document.getElementById('sellAFN').value)||0;
let rate=Number(document.getElementById('rate').value)||0;
document.getElementById('sellUSD').value=rate?(afn/rate).toFixed(2):'';
}
function addProduct(){
let name=document.getElementById('pname').value.trim();
let rate=Number(document.getElementById('rate').value);
let buy=Number(document.getElementById('buyUSD').value);
let sell=Number(document.getElementById('sellUSD').value);
let qty=Number(document.getElementById('qty').value);
if(!name||!rate||!qty||qty<0){
alert(english?'Enter name, exchange rate and quantity':'د پرزې نوم، د تبادلې نرخ او تعداد ولیکئ');
return;
}
let data=readData();
data.push({
name:name,buyUSD:buy,rate:rate,buyAFN:buy*rate,
sellUSD:sell,sellAFN:sell*rate,qty:qty
});
saveData(data);
renderProducts();
document.getElementById('pname').value='';
document.getElementById('buyUSD').value='';
document.getElementById('rate').value='';
document.getElementById('buyAFN').value='';
document.getElementById('sellUSD').value='';
document.getElementById('sellAFN').value='';
document.getElementById('qty').value='';
}

function renderProducts(){
let box=document.getElementById('items');
if(!box)return;
let data=readData();
box.innerHTML=data.map((p,i)=>`
<div class="product">
<b>${p.name}</b><br>
<small>رانیول: $${p.buyUSD} | ${p.buyAFN.toFixed(2)} AFN</small><br>
<small>د تبادلې نرخ: ${p.rate}</small><br>
<small>خرڅول: $${p.sellUSD} | ${p.sellAFN.toFixed(2)} AFN</small><br>
<small>تعداد: ${p.qty}</small><br>
<small>د یوې دانې ګټه: ${(p.sellAFN-p.buyAFN).toFixed(2)} AFN</small>
<button onclick="editProduct(${i})">سمول</button>
<button onclick="deleteProduct(${i})" style="background:#b3261e">حذف</button>
</div>`).join('');
}

function editProduct(i){
let data=readData();
let p=data[i];
let name=prompt('د پرزې نوی نوم:',p.name);
if(name===null)return;
let buy=prompt('د رانیولو قیمت په ډالرو:',p.buyUSD);
if(buy===null)return;
let rate=prompt('د ډالر د تبادلې نرخ:',p.rate);
if(rate===null)return;
let sell=prompt('د خرڅولو قیمت په ډالرو:',p.sellUSD);
if(sell===null)return;
let qty=prompt('تعداد:',p.qty);
if(qty===null)return;
buy=Number(buy);rate=Number(rate);sell=Number(sell);qty=Number(qty);
if(!name.trim()||rate<=0||buy<0||sell<0||qty<0||![buy,rate,sell,qty].every(Number.isFinite)){
alert('معلومات سم نه دي');
return;
}
data[i]={
name:name.trim(),
buyUSD:buy,
rate:rate,
buyAFN:buy*rate,
sellUSD:sell,
sellAFN:sell*rate,
qty:qty
};
saveData(data);
renderProducts();
alert('پرزه سمه شوه');
}

function deleteProduct(i){
if(!confirm('ایا دا پرزه حذف کول غواړې؟'))return;
let data=readData();
data.splice(i,1);
saveData(data);
renderProducts();
alert('پرزه حذف شوه');
}

}
function addCustomer(){
let input=document.getElementById('itemName');
if(input.value.trim()){
let list=document.getElementById('items');
let row=document.createElement('p');
row.textContent=input.value;
list.appendChild(row);
input.value='';
}
}
</script>
</body>
</html>
